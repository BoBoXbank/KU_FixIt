<!DOCTYPE html>
<html lang="th">
<head>
    <!-- ===================================================== -->
    <!-- ================= ส่วนตั้งค่าเบื้องต้น ===================== -->
    <!-- ===================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน - KU FixIt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- ===================================================== -->
    <!-- =================  CSS ตกแต่งหน้า ==================== -->
    <!-- ===================================================== -->
    <style>
        /* พื้นหลังหลักของหน้า */
        body {
            background-color: #D8F2E9; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* กล่องฟอร์ม (Card) */
        .auth-card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        /* input style */
        .custom-input {
            background-color: #f4f9f6;
            border-radius: 12px;
            padding: 5px 10px;
            border: 1px solid transparent;
            margin-bottom: 20px;
        }
        /* effect ตอน focus input */
        .custom-input:focus-within {
            border: 1px solid #0da360;
        }
        /* ลบ shadow ของ bootstrap */
        .form-control:focus {
            box-shadow: none;
        }
        /* ปุ่ม submit */
        .btn-success {
            background-color: #38a169;
            border: none;
            border-radius: 12px;
            padding: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        /* hover ปุ่ม */
        .btn-success:hover {
            background-color: #2f855a;
        }
    </style>
</head>
<body>
    <!-- ===================================================== -->
    <!-- ================== กล่องฟอร์มหลัก ===================== -->
    <!-- ===================================================== -->
    <div class="auth-card text-center">
        <!-- ===================================================== -->
        <!-- ================== โลโก้ KU ========================== -->
        <!-- ===================================================== -->
        <div class="mb-3">
            <h1 class="fw-bold" style="color: #006666; margin-bottom: 0; font-size: 3.5rem; line-height: 1;">KU</h1>
            <!-- เส้นสี -->
            <div style="height: 4px; background: linear-gradient(to right, #006666 50%, #a6ce39 50%); width: 90px; margin: 5px auto;"></div>
            <!-- ข้อความมหาวิทยาลัย -->
            <div style="color: #006666; font-size: 0.75rem; font-weight: bold; letter-spacing: 1px; line-height: 1.2;">
                KASETSART<br>UNIVERSITY
            </div>
        </div>
        <!-- ===================================================== -->
        <!-- ================== หัวข้อหน้า ========================= -->
        <!-- ===================================================== -->
        <h2 class="fw-bold mt-4" style="color: #006666; letter-spacing: 2px;">FORGET</h2>
        <small class="text-muted">หอพักนักศึกษา</small>

         <!-- ===================================================== -->
        <!-- =============== แสดงข้อความแจ้งเตือน ==================== -->
        <!-- ===================================================== -->

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mt-3">
                <!-- loop แสดงแต่ละ message -->    
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} py-2" style="font-size: 0.9rem;">{{ message }}</div>
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <!-- ===================================================== -->
        <!-- ================== ฟอร์มกรอก Username ================ -->
        <!-- ===================================================== -->
        <form method="POST" class="mt-4">
            <!-- ช่องกรอก username -->
            <div class="input-group custom-input">
                <!-- icon -->    
                <span class="input-group-text bg-transparent border-0 text-muted"><i class="bi bi-person"></i></span>
                <!-- input -->
                <input type="text" name="username" class="form-control border-0 bg-transparent text-secondary" placeholder="Username" required>
            </div>
            <!-- ปุ่ม submit -->
            <button type="submit" class="btn btn-success w-50 rounded-pill mt-3">Next</button>
        </form>
        <!-- ===================================================== -->
        <!-- ===============  ลิงก์ไปหน้า Login =====================  -->
        <!-- ===================================================== -->
        <div class="mt-4">
            <small class="text-muted">Already Have An Account? <a href="/login" class="text-dark fw-bold text-decoration-none">Sign In</a></small>
        </div>
    </div>

</body>
</html>
