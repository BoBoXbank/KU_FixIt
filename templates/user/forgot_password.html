{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4 text-center">
            <h3>🔑 ลืมรหัสผ่าน</h3>
            <p class="text-muted">กรอกชื่อผู้ใช้ของคุณเพื่อเริ่มกู้คืนรหัสผ่าน</p>
            <form method="POST">
                <div class="mb-3 text-start">
                    <label>Username ของคุณ</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-theme w-100">ถัดไป</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
