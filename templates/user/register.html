<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - KU FixIt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

<style>
/* การตกแต่งหน้าจอและ Card สมัครสมาชิก */
body {
    background-color: #D8F2E9; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
}
.register-card {
    background: white;
    border-radius: 30px;
    padding: 40px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}
.form-control {
    border-radius: 10px;
    padding: 12px 15px;
    border: 1px solid #e0e0e0;
    margin-bottom: 15px;
    color: #555;
}
.form-control:focus {
    border-color: #0da360;
    box-shadow: 0 0 0 0.2rem rgba(13, 163, 96, 0.25);
}
.btn-success {
    background-color: #0da360; 
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-weight: bold;
    font-size: 1.1rem;
    width: 100%;
    margin-top: 10px;
    transition: all 0.3s;
}
.btn-success:hover {
    background-color: #0b8a51;
    transform: translateY(-2px);
}
</style>
</head>

<body>

<div class="register-card">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-dark">สมัครสมาชิก</h2>
        <small class="text-muted">Create an account to enjoy</small>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} rounded-3 text-center">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" id="registerForm">
        <input type="text" class="form-control" name="username" placeholder="username*" required>

        <input type="password" id="regPassword" class="form-control" name="password"
        placeholder="Password (อักษร + ตัวเลข 8 ตัวขึ้นไป)*"
        required minlength="8"
        pattern="^(?=.*[a-zA-Z])(?=.*\d)[a-zA-Z0-9]{8,}$"
        title="รหัสผ่านต้องยาวอย่างน้อย 8 ตัว และมีทั้งตัวอักษรและตัวเลขเท่านั้น">

        <input type="text" class="form-control" name="first_name" placeholder="ชื่อ*" required>
        <input type="text" class="form-control" name="last_name" placeholder="นามสกุล*" required>

        <input type="email" class="form-control" name="email" id="emailInput"
        placeholder="email (@ku.th)*"
        required
        pattern="^.+@(ku\.th)$"
        title="กรุณาใช้อีเมลที่ลงท้ายด้วย @ku.th เท่านั้น">

        <div class="d-flex mb-2">
            <input type="text" class="form-control me-2 mb-0" id="otpInput" placeholder="กรอกรหัส OTP 4 หลัก">
            <button type="button" class="btn btn-secondary" id="sendOtpBtn" onclick="sendOTP()">Send OTP</button>
            <button type="button" class="btn btn-warning" id="resendOtpBtn" onclick="sendOTP()" style="display:none;">Resend OTP</button>
        </div>

        <div class="d-flex mb-2">
            <button type="button" class="btn btn-primary w-100" id="verifyOtpBtn" onclick="verifyOTP()">Verify OTP</button>
        </div>

        <div class="text-center mb-3">
            <small id="otpTimer" class="text-muted"></small>
        </div>

        <input type="text" 
               class="form-control" 
               name="phone" 
               id="phoneInput"
               placeholder="เบอร์โทรศัพท์ (ตัวเลข 9-10 หลัก)*" 
               required 
               maxlength="10"
               inputmode="numeric"
               oninput="this.value = this.value.replace(/[^0-9]/g, '')">

        <select class="form-control" name="building" required>
        <option value="" disabled selected>เลือกอาคาร/ตึก (1-8)*</option>
        <option value="1">อาคาร 1</option>
        <option value="2">อาคาร 2</option>
        <option value="3">อาคาร 3</option>
        <option value="4">อาคาร 4</option>
        <option value="5">อาคาร 5</option>
        <option value="6">อาคาร 6</option>
        <option value="7">อาคาร 7</option>
        <option value="8">อาคาร 8</option>
        </select>

        <input type="text" 
         class="form-control" 
         name="room_number" 
         placeholder="หมายเลขห้อง (ตัวเลขเท่านั้น / ช่างให้ตอบ 0000)*" 
         required 
         inputmode="numeric"
         oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        <input type="text" class="form-control" name="question" placeholder="คำถามความปลอดภัย (เช่น ชื่อหมาตัวแรก)*" required>
        <input type="text" class="form-control" name="answer" placeholder="คำตอบสำหรับกู้รหัสผ่าน*" required>

        <div class="d-flex justify-content-center mb-3 mt-2">
            <div class="g-recaptcha" data-sitekey="6LebUngsAAAAAPMg-oO9-SN_SqAU9zWdLK84Itx5"></div>
        </div>

        <button type="submit" class="btn btn-success">Create Account</button>

        <div class="text-center mt-4">
            <small class="text-muted">
            Already Have An Account?
            <a href="/login" class="text-dark fw-bold text-decoration-none">Sign In</a>
            </small>
        </div>
    </form>
</div>

<script>
    // ตรวจสอบความถูกต้องของข้อมูลก่อนส่งฟอร์ม (Form Validation)
    document.getElementById("registerForm").addEventListener("submit", function(event) {
        // เช็ค reCAPTCHA
        var recaptchaResponse = grecaptcha.getResponse();
        if (recaptchaResponse.length === 0) {
            event.preventDefault();
            alert("กรุณาติ๊กที่ช่อง 'ฉันไม่ใช่โปรแกรมอัตโนมัติ' (reCAPTCHA) ก่อนสมัครสมาชิกครับ");
            return;
        }
        // เช็ครูปแบบรหัสผ่าน
        const password = document.getElementById('regPassword').value;
        const passwordRegex = /^(?=.*[a-zA-Z])(?=.*\d)[a-zA-Z0-9]{8,}$/;
        if (!passwordRegex.test(password)) {
            event.preventDefault();
            alert('รหัสผ่านไม่ถูกต้อง!\n\nรหัสผ่านต้องมีคุณสมบัติดังนี้:\n- ความยาวอย่างน้อย 8 ตัวอักษร\n- ประกอบด้วย "ตัวอักษรภาษาอังกฤษ" และ "ตัวเลข" ผสมกัน\n- ห้ามใช้อักขระพิเศษ (เช่น @, #, !)');
            document.getElementById('regPassword').focus();
            return;
        }
        // เช็คความยาวเบอร์โทรศัพท์
        const phone = document.getElementById('phoneInput').value;
        if (phone.length < 9) {
            event.preventDefault();
            alert('กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง (9-10 หลัก)');
            document.getElementById('phoneInput').focus();
            return;
        }
        // เช็คว่ายืนยัน OTP สำเร็จหรือยัง
        if(!otpVerified){
            event.preventDefault();
            alert("กรุณายืนยัน OTP ทางอีเมลก่อนสมัครสมาชิกครับ");
        }
    });
</script>

<script>
    /* ระบบจัดการ OTP */
    let otpVerified = false;
    let otpExpireTime = null;
    let timerInterval = null;

    function sendOTP(){
        const email = document.getElementById("emailInput").value;
        const emailRegex = /^.+@(ku\.th)$/;

        if(!email){
            alert("กรุณากรอกอีเมลก่อนส่ง OTP");
            return;
        }
        if(!emailRegex.test(email)) {
            alert("กรุณาใช้อีเมลที่ลงท้ายด้วย @ku.th เท่านั้น");
            return;
        }

        document.getElementById("sendOtpBtn").innerText = "กำลังส่ง...";
        document.getElementById("sendOtpBtn").disabled = true;

        fetch("/send_otp",{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({email:email})
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message);
            if(data.success){
                otpExpireTime = Date.now() + (2*60*1000);
                document.getElementById("sendOtpBtn").style.display="none";
                document.getElementById("resendOtpBtn").style.display="inline-block";
                document.getElementById("resendOtpBtn").disabled = false;
                startTimer();
            } else {
                document.getElementById("sendOtpBtn").innerText = "Send OTP";
                document.getElementById("sendOtpBtn").disabled = false;
            }
        })
        .catch(error => {
            console.error('Error sending OTP:', error);
            alert("เกิดข้อผิดพลาดในการส่ง OTP");
            document.getElementById("sendOtpBtn").innerText = "Send OTP";
            document.getElementById("sendOtpBtn").disabled = false;
        });
    }
// ฟังก์ชันยืนยันรหัส OTP
    function verifyOTP(){
        const otp = document.getElementById("otpInput").value;
        const email = document.getElementById("emailInput").value;

        if(!otp){
            alert("กรุณากรอกรหัส OTP");
            return;
        }

        fetch("/verify_otp",{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({otp: otp, email: email})
        })
        .then(res=>res.json())
        .then(data=>{
            alert(data.message); 
            if(data.success){
                otpVerified = true;
                clearInterval(timerInterval);
                
                const timerLabel = document.getElementById("otpTimer");
                timerLabel.innerText = "ยืนยันอีเมลสำเร็จแล้ว ✅";
                timerLabel.className = "text-success fw-bold";
                
                document.getElementById("emailInput").readOnly = true;
                document.getElementById("otpInput").readOnly = true;
                document.getElementById("verifyOtpBtn").disabled = true;
                document.getElementById("resendOtpBtn").style.display = "none";
            }
        })
        .catch(error => {
            console.error('Error verifying OTP:', error);
            alert("เกิดข้อผิดพลาดในการตรวจสอบ OTP");
        });
    }
// ฟังก์ชันนับเวลาถอยหลัง 120 วินาที
    function startTimer(){
        clearInterval(timerInterval);
        timerInterval = setInterval(function(){
            const remaining = otpExpireTime - Date.now();
            if(remaining <= 0){
                clearInterval(timerInterval);
                const timerLabel = document.getElementById("otpTimer");
                timerLabel.innerText = "OTP หมดอายุ กรุณากด Resend OTP";
                timerLabel.className = "text-danger";
                otpVerified = false;
                return;
            }
            const seconds = Math.floor(remaining/1000);
            document.getElementById("otpTimer").innerText = "OTP จะหมดอายุใน " + seconds + " วินาที";
            document.getElementById("otpTimer").className = "text-muted";
        }, 1000);
    }
</script>

</body>
</html>
