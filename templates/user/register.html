<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - KU FixIt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

<style>
/* การตกแต่งหน้าจอและ Card สมัครสมาชิก */
body {
    background-color: #f0f7f4; /* สีเขียวมิ้นต์อ่อนๆ ดูสบายตากว่าเดิม */
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
}
.register-card {
    background: white;
    border-radius: 30px;
    padding: 40px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.08); /* เงาฟุ้งๆ ดูแพง */
}
.form-control {
    border-radius: 12px;
    padding: 12px 18px;
    border: 1px solid #eee;
    margin-bottom: 15px;
    transition: all 0.3s;
    background-color: #fdfdfd;
}
.form-control:focus {
    border-color: #0da360;
    box-shadow: 0 0 0 4px rgba(13, 163, 96, 0.1);
    background-color: #fff;
}
.btn-success {
    background: linear-gradient(135deg, #0da360 0%, #0b8a51 100%);
    border: none;
    border-radius: 15px;
    padding: 14px;
    font-weight: bold;
    font-size: 1.1rem;
    width: 100%;
    margin-top: 10px;
    box-shadow: 0 4px 15px rgba(13, 163, 96, 0.3);
}
.btn-success:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(13, 163, 96, 0.4);
}

/* --- New Premium OTP Design --- */
.otp-wrapper {
    background: #ffffff;
    border: 1.5px solid #edf2f0;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    position: relative;
}
.otp-label {
    font-size: 0.85rem;
    font-weight: 700;
    color: #444;
    margin-bottom: 12px;
    display: block;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.custom-input-group {
    display: flex;
    background: #f1f3f2;
    border-radius: 12px;
    padding: 5px;
    margin-bottom: 12px;
}
.custom-input-group .form-control {
    background: transparent;
    border: none;
    margin-bottom: 0;
    box-shadow: none;
}
#sendOtpBtn, #resendOtpBtn {
    border-radius: 10px;
    padding: 8px 15px;
    font-size: 0.85rem;
    font-weight: 600;
    min-width: 100px;
}
#verifyOtpBtn {
    background: #2c3e50;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    transition: all 0.3s;
}
#verifyOtpBtn:hover:not(:disabled) {
    background: #1a252f;
    transform: scale(1.02);
}
/* ---------------------------------- */
</style>
</head>

<body>

<div class="register-card">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-dark">สมัครสมาชิก</h2>
        <p class="text-muted small">KU FixIt - ระบบแจ้งซ่อมสำหรับชาวเกษตร</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} rounded-3 text-center">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" id="registerForm">
        <input type="text" class="form-control" name="username" placeholder="Username*" required>

        <input type="password" id="regPassword" class="form-control" name="password"
        placeholder="Password (อักษร + ตัวเลข 8 ตัวขึ้นไป)*"
        required minlength="8"
        pattern="^(?=.*[a-zA-Z])(?=.*\d)[a-zA-Z0-9]{8,}$"
        title="รหัสผ่านต้องยาวอย่างน้อย 8 ตัว และมีทั้งตัวอักษรและตัวเลขเท่านั้น">

        <div class="row g-2">
            <div class="col-6"><input type="text" class="form-control" name="first_name" placeholder="ชื่อ*" required></div>
            <div class="col-6"><input type="text" class="form-control" name="last_name" placeholder="นามสกุล*" required></div>
        </div>

        <input type="email" class="form-control" name="email" id="emailInput"
        placeholder="อีเมลนิสิต (@ku.th)*"
        required
        pattern="^.+@(ku\.th)$"
        title="กรุณาใช้อีเมลที่ลงท้ายด้วย @ku.th เท่านั้น">

        <div class="otp-wrapper">
            <span class="otp-label">การยืนยันตัวตน (OTP)</span>
            <div class="custom-input-group">
                <input type="text" class="form-control" id="otpInput" placeholder="กรอกรหัส 4 หลัก" maxlength="4" inputmode="numeric">
                <button type="button" class="btn btn-success" id="sendOtpBtn" onclick="sendOTP()">Send OTP</button>
                <button type="button" class="btn btn-warning" id="resendOtpBtn" onclick="sendOTP()" style="display:none;">Resend OTP</button>
            </div>
            <button type="button" class="btn btn-primary w-100" id="verifyOtpBtn" onclick="verifyOTP()">
                VERIFY NOW
            </button>
            <div class="text-center mt-2">
                <small id="otpTimer" class="text-muted" style="font-size: 0.75rem;"></small>
            </div>
        </div>

        <input type="text" 
               class="form-control" 
               name="phone" 
               id="phoneInput"
               placeholder="เบอร์โทรศัพท์ (9-10 หลัก)*" 
               required 
               maxlength="10"
               inputmode="numeric"
               oninput="this.value = this.value.replace(/[^0-9]/g, '')">

        <select class="form-control" name="building" required>
            <option value="" disabled selected>เลือกอาคาร/ตึก (1-8)*</option>
            <option value="1">อาคาร 1</option>
            <option value="2">อาคาร 2</option>
            <option value="3">อาคาร 3</option>
            <option value="4">อาคาร 4</option>
            <option value="5">อาคาร 5</option>
            <option value="6">อาคาร 6</option>
            <option value="7">อาคาร 7</option>
            <option value="8">อาคาร 8</option>
        </select>

        <input type="text" 
         class="form-control" 
         name="room_number" 
         placeholder="หมายเลขห้อง (ช่างให้ตอบ 0000)*" 
         required 
         inputmode="numeric"
         oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        
        <input type="text" class="form-control" name="question" placeholder="คำถามความปลอดภัย (ชื่อหมาตัวแรก)*" required>
        <input type="text" class="form-control" name="answer" placeholder="คำตอบสำหรับกู้รหัสผ่าน*" required>

        <div class="d-flex justify-content-center mb-3 mt-2">
            <div class="g-recaptcha" data-sitekey="6LebUngsAAAAAPMg-oO9-SN_SqAU9zWdLK84Itx5"></div>
        </div>

        <button type="submit" class="btn btn-success">CREATE ACCOUNT</button>

        <div class="text-center mt-4">
            <small class="text-muted">
            Already Have An Account?
            <a href="/login" class="text-dark fw-bold text-decoration-none">Sign In</a>
            </small>
        </div>
    </form>
</div>

<script>
    /* ส่วน Logic JS เหมือนเดิมเป๊ะ (กันพลาด) */
    let otpVerified = false;
    let otpExpireTime = null;
    let timerInterval = null;

    document.getElementById("registerForm").addEventListener("submit", function(event) {
        var recaptchaResponse = grecaptcha.getResponse();
        if (recaptchaResponse.length === 0) {
            event.preventDefault();
            alert("กรุณาติ๊กที่ช่อง 'ฉันไม่ใช่โปรแกรมอัตโนมัติ' ก่อนสมัครสมาชิกครับ");
            return;
        }
        if(!otpVerified){
            event.preventDefault();
            alert("กรุณายืนยัน OTP ทางอีเมลก่อนสมัครสมาชิกครับ");
        }
    });

    function sendOTP(){
        const email = document.getElementById("emailInput").value;
        if(!email || !email.includes("@ku.th")){
            alert("กรุณากรอกอีเมล @ku.th ให้ถูกต้อง");
            return;
        }
        document.getElementById("sendOtpBtn").innerText = "ส่งรหัส...";
        document.getElementById("sendOtpBtn").disabled = true;

        fetch("/send_otp",{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({email:email})
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message);
            if(data.success){
                otpExpireTime = Date.now() + (2*60*1000);
                document.getElementById("sendOtpBtn").style.display="none";
                document.getElementById("resendOtpBtn").style.display="inline-block";
                document.getElementById("resendOtpBtn").disabled = false;
                startTimer();
            } else {
                document.getElementById("sendOtpBtn").innerText = "Send OTP";
                document.getElementById("sendOtpBtn").disabled = false;
            }
        });
    }

    function verifyOTP(){
        const otp = document.getElementById("otpInput").value;
        const email = document.getElementById("emailInput").value;
        if(!otp) return alert("กรุณากรอกรหัส OTP");

        fetch("/verify_otp",{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({otp: otp, email: email})
        })
        .then(res=>res.json())
        .then(data=>{
            alert(data.message); 
            if(data.success){
                otpVerified = true;
                clearInterval(timerInterval);
                document.getElementById("otpTimer").innerText = "ยืนยันสำเร็จแล้ว ✅";
                document.getElementById("otpTimer").className = "text-success fw-bold";
                document.getElementById("emailInput").readOnly = true;
                document.getElementById("otpInput").readOnly = true;
                document.getElementById("verifyOtpBtn").disabled = true;
                document.getElementById("verifyOtpBtn").style.background = "#28a745";
                document.getElementById("verifyOtpBtn").innerText = "VERIFIED ✅";
            }
        });
    }

    function startTimer(){
        clearInterval(timerInterval);
        timerInterval = setInterval(function(){
            const remaining = otpExpireTime - Date.now();
            if(remaining <= 0){
                clearInterval(timerInterval);
                document.getElementById("otpTimer").innerText = "หมดเวลา! กรุณากดส่งใหม่";
                document.getElementById("otpTimer").className = "text-danger";
                return;
            }
            const seconds = Math.floor(remaining/1000);
            document.getElementById("otpTimer").innerText = "ส่งรหัสใหม่ได้ใน " + seconds + " วินาที";
        }, 1000);
    }
</script>
</body>
</html>
