{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4">
            <h2 class="text-center mb-4">เข้าสู่ระบบ</h2>
            <form method="POST">
                <div class="mb-3">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-theme w-100 mb-3">เข้าสู่ระบบ</button>
                <div class="text-center">
                    <a href="/forgot-password" class="text-muted text-decoration-none">ลืมรหัสผ่าน?</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
