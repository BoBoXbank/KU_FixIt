<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KU FixIt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-[#D1F2EB] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-sm text-center">
        <div class="mb-6">
            <h1 class="text-6xl font-black text-[#006652] m-0">KU</h1>
            <p class="text-[#006652] text-[10px] tracking-[0.3em] font-bold uppercase">Kasetsart University</p>
        </div>

        <h2 class="text-2xl font-bold text-[#004D40] mb-1">ระบบแจ้งซ่อม</h2>
        <p class="text-gray-400 text-sm mb-8">หอพักนักศึกษา</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="bg-red-50 text-red-500 text-xs p-2 rounded-lg mb-4">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('user.login') }}" method="POST" class="space-y-4">
            <div class="relative">
                <span class="absolute left-4 top-3.5 text-gray-400">👤</span>
                <input type="text" name="username" placeholder="Username" required
                    class="w-full pl-12 pr-4 py-3 bg-[#F0F7F5] rounded-2xl focus:outline-none focus:ring-2 focus:ring-[#2E7D32]">
            </div>

            <div class="relative">
                <span class="absolute left-4 top-3.5 text-gray-400">🔒</span>
                <input type="password" name="password" placeholder="Password" required
                    class="w-full pl-12 pr-4 py-3 bg-[#F0F7F5] rounded-2xl focus:outline-none focus:ring-2 focus:ring-[#2E7D32]">
            </div>

            <button type="submit" 
                class="w-3/5 bg-[#4DB6AC] hover:bg-[#26A69A] text-white font-semibold py-3 rounded-2xl mt-4 shadow-lg transition-all active:scale-95">
                เข้าสู่ระบบ
            </button>
        </form>

        <div class="mt-4">
            <a href="{{ url_for('user.forgot_password') }}" class="text-gray-400 text-xs hover:text-[#006652]">Forgot password?</a>
        </div>

        <div class="mt-8">
            <a href="{{ url_for('user.register') }}" 
                class="inline-block w-4/5 bg-[#66BB6A] hover:bg-[#43A047] text-white font-semibold py-3 rounded-2xl shadow-md transition-all active:scale-95">
                สมัครสมาชิก
            </a>
        </div>
    </div>

</body>
</html>
