<!DOCTYPE html>
<html>
<head>
    <title>ฟอร์มแจ้งซ่อม</title>
    <style>body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }</style>
</head>
<body>
    <h2>📝 แบบฟอร์มแจ้งซ่อม</h2>
    <form method="POST">
        <label>หัวข้อปัญหา:</label><br>
        <input type="text" name="title" required style="width: 100%;"><br><br>
        
        <label>สถานที่ (ตึก/ห้อง):</label><br>
        <input type="text" name="location" required style="width: 100%;"><br><br>
        
        <label>รายละเอียดเพิ่มเติม:</label><br>
        <textarea name="detail" rows="4" style="width: 100%;"></textarea><br><br>
        
        <button type="submit" style="background: blue; color: white; padding: 10px; border: none; cursor: pointer;">ส่งเรื่องแจ้งซ่อม</button>
        <a href="/">ยกเลิก</a>
    </form>
</body>
</html>
