{% extends "layout.html" %}
{% block content %}
<div class="container-fluid py-4" style="background-color: #D8F2E9; min-height: 100vh;">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center">
            <span class="fs-2 me-2">📋</span>
            <h2 class="fw-bold mb-0">ใบแจ้งซ่อม</h2>
        </div>
        <a href="{{ url_for('user.profile') }}" class="text-decoration-none">
            <div class="rounded-circle shadow-sm d-flex align-items-center justify-content-center bg-white" 
                 style="width: 60px; height: 60px; overflow: hidden;">
                <i class="bi bi-person-fill fs-2 text-secondary"></i>
            </div>
        </a>
    </div>

    <div class="card border-0 shadow-lg mx-auto" style="max-width: 750px; border-radius: 35px; padding: 40px;">
        <form action="{{ url_for('user.report') }}" method="POST" enctype="multipart/form-data">
            
            <div class="row g-3 mb-3">
                <div class="col-md-7">
                    <label class="text-success fw-bold small mb-1">อาคาร</label>
                    <select name="location_building" class="form-select border-0 bg-light rounded-3 py-2">
                        <option selected disabled>เลือกอาคาร</option>
                        <option value="อาคาร A">อาคาร A</option>
                        <option value="อาคาร B">อาคาร B</option>
                        <option value="อาคาร C">อาคาร C</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="text-success fw-bold small mb-1">ห้อง</label>
                    <input type="text" name="location_room" class="form-control border-0 bg-light rounded-3 py-2" placeholder="เช่น 301">
                </div>
            </div>

            <div class="mb-3">
                <label class="text-success fw-bold small mb-1">ประเภทปัญหา</label>
                <select name="title" class="form-select border-0 bg-light rounded-3 py-2">
                    <option selected disabled>เลือกประเภท</option>
                    <option value="ไฟฟ้า">ไฟฟ้า</option>
                    <option value="ประปา">ประปา</option>
                    <option value="แอร์">แอร์</option>
                    <option value="อื่นๆ">อื่นๆ</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="text-success fw-bold small mb-1">รายละเอียดปัญหา</label>
                <textarea name="detail" class="form-control border-0 bg-light rounded-3 py-2" rows="3" placeholder="อธิบายปัญหาที่พบ เช่น ตำแหน่ง อาคาร เวลาที่เกิดปัญหา..."></textarea>
            </div>

            <div class="mb-4">
                <label class="text-success fw-bold small mb-1">แนบรูปภาพ (ไม่บังคับ)</label>
                <div class="upload-area border-2 border-dashed rounded-4 p-4 text-center bg-light" 
                     style="border-color: #cfded9 !important; cursor: pointer;"
                     onclick="document.getElementById('imageInput').click()">
                    <i class="bi bi-camera-fill fs-1 text-secondary"></i>
                    <p class="mb-0 text-muted small mt-2">คลิกเพื่อเลือกรูปภาพ หรือลากไฟล์มาวาง<br>รองรับ JPG, PNG ขนาดไม่เกิน 5MB</p>
                    <input type="file" name="image" id="imageInput" accept="image/*" hidden onchange="updateFileName(this)">
                    <div id="file-chosen" class="mt-2 fw-bold text-success small"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="text-success fw-bold small mb-1">วัน-เวลาที่สะดวกให้เข้าซ่อม</label>
                <input type="datetime-local" name="repair_time" class="form-control border-0 bg-light rounded-3 py-2">
            </div>

            <div class="mb-4">
                <label class="text-success fw-bold small mb-1">เบอร์โทรติดต่อ</label>
                <input type="text" name="phone" class="form-control border-0 bg-light rounded-3 py-2" placeholder="0XX-XXX-XXXX">
            </div>

            <div class="d-flex gap-3">
                <button type="submit" class="btn btn-success flex-grow-1 rounded-pill py-3 fw-bold" style="background-color: #3AA482;">ส่งใบแจ้งซ่อม</button>
                <button type="button" class="btn btn-light px-5 rounded-pill py-3 fw-bold text-muted" 
                        onclick="window.history.back()" style="background-color: #F1F8F6;">ยกเลิก</button>
            </div>
        </form>
    </div>
</div>

<script>
function updateFileName(input) {
    const fileChosen = document.getElementById('file-chosen');
    fileChosen.textContent = input.files.length > 0 ? "ไฟล์ที่เลือก: " + input.files[0].name : "";
}
</script>
{% endblock %}
