{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="text-center mb-4">ยืนยันตัวตน</h3>
            <div class="alert alert-info">
                <strong>คำถามของคุณ:</strong> {{ question }}
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label>คำตอบของคุณ</label>
                    <input type="text" name="answer" class="form-control" required>
                </div>
                <hr>
                <div class="mb-3">
                    <label>ตั้งรหัสผ่านใหม่</label>
                    <input type="password" name="new_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-theme w-100">บันทึกรหัสผ่านใหม่</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
