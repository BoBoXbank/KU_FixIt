<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ - KU FixIt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #D8F2E9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .custom-input {
            background-color: #f4f9f6;
            border-radius: 12px;
            padding: 2px 10px;
            border: 1px solid transparent;
            margin-bottom: 15px;
        }
        .custom-input:focus-within {
            border: 1px solid #0da360;
        }
        .form-control:focus {
            box-shadow: none;
        }
        .btn-success {
            background-color: #38a169;
            border: none;
            border-radius: 12px;
            padding: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        .btn-success:hover {
            background-color: #2f855a;
        }
    </style>
</head>
<body>

    <div class="auth-card text-center">
        <div class="mb-3">
            <h1 class="fw-bold" style="color: #006666; margin-bottom: 0; font-size: 3.5rem; line-height: 1;">KU</h1>
            <div style="height: 4px; background: linear-gradient(to right, #006666 50%, #a6ce39 50%); width: 90px; margin: 5px auto;"></div>
            <div style="color: #006666; font-size: 0.75rem; font-weight: bold; letter-spacing: 1px; line-height: 1.2;">
                KASETSART<br>UNIVERSITY
            </div>
        </div>

        <h2 class="fw-bold mt-4" style="color: #006666; letter-spacing: 2px;">FORGET</h2>
        <small class="text-muted">หอพักนักศึกษา</small>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mt-3">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} py-2" style="font-size: 0.9rem;">{{ message }}</div>
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" class="mt-4">
            
            <div class="input-group custom-input">
                <span class="input-group-text bg-transparent border-0 text-muted"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control border-0 bg-transparent text-secondary" value="{{ question }}" readonly>
            </div>

            <div class="input-group custom-input">
                <span class="input-group-text bg-transparent border-0 text-muted" style="visibility: hidden;"><i class="bi bi-chat"></i></span>
                <input type="text" name="answer" class="form-control border-0 bg-transparent text-secondary" placeholder="Answer :" required>
            </div>

            <div class="input-group custom-input mt-4">
                <span class="input-group-text bg-transparent border-0 text-muted"><i class="bi bi-key"></i></span>
                <input type="password" name="new_password" class="form-control border-0 bg-transparent text-secondary" placeholder="reset password" required minlength="6">
            </div>
            
            <button type="submit" class="btn btn-success w-50 rounded-pill mt-3">Next</button>
        </form>
        
        <div class="mt-4">
            <small class="text-muted">Already Have An Account? <a href="/login" class="text-dark fw-bold text-decoration-none">Sign In</a></small>
        </div>
    </div>

</body>
</html>
