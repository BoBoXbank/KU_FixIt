{% extends "layout.html" %}
{% block content %}
<div class="text-center mt-5">
    <h1 class="display-4 fw-bold text-success mb-3">แจ้งซ่อมออนไลน์</h1>
    <p class="lead text-muted mb-5">ระบบแจ้งปัญหาภายในมหาวิทยาลัย สะดวก รวดเร็ว ทันใจ</p>
    
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-5 text-center h-100">
                <div class="display-1 mb-3">🔧</div>
                <h3>ต้องการแจ้งซ่อม?</h3>
                <p class="text-muted">พบปัญหา แอร์เสีย ไฟดับ น้ำไม่ไหล แจ้งเลย!</p>
                <a href="/report" class="btn btn-theme w-100 mt-3">แจ้งเรื่องใหม่</a>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card p-5 text-center h-100">
                <div class="display-1 mb-3">👨‍🔧</div>
                <h3>สำหรับเจ้าหน้าที่</h3>
                <p class="text-muted">ตรวจสอบสถานะงานและจัดการการซ่อม</p>
                <a href="/admin" class="btn btn-outline-secondary w-100 mt-3 rounded-pill">เข้าสู่ระบบ</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
